name: Store expiry cron integration

on:
  pull_request:
    paths:
      - 'src/lib/cron/**'
      - 'src/app/api/cron/store-checkout-expiry/**'
      - 'src/lib/supabase/service-role.ts'
      - 'proxy.ts'
      - 'vercel.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/store-expiry-cron.yml'

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:database:harness
