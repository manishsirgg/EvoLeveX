name: Database integration

on:
  pull_request:
    paths:
      - 'tests/database/**'
      - 'src/lib/cron/**'
      - 'src/app/api/cron/store-checkout-expiry/**'
      - 'tests/store-checkout-expiry-cron.test.mjs'
      - 'proxy.ts'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 15
            cli: 2.48.3
          - postgres: 17
            cli: 2.120.0
    env:
      # The runner ignores generic database URLs and accepts only its compiled-in
      # loopback endpoint. These values document the non-production boundary.
      EVOLEVEX_DATABASE_TEST_PROJECT: evolevex-p1-003
      EVOLEVEX_DATABASE_TEST_PORT: '55432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ matrix.cli }}
      - name: Select isolated disposable PostgreSQL major version
        env:
          TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: |
          python - <<'PYCONFIG'
          import os
          from pathlib import Path
          p = Path('tests/database/supabase/config.toml')
          text = p.read_text()
          assert text.count('major_version = 15') == 1
          p.write_text(text.replace('major_version = 15', 'major_version = ' + os.environ['TEST_POSTGRES_MAJOR']))
          PYCONFIG
      - run: npm ci
      - run: npm run test:database:harness
      - run: npm run test:database:integration
